<html>
<meta name="viewport" content="width=device-width, initial-scale=0.75">
<head><title>Picker</title></head>
<style>
body {
  background-image: url('/survey/fence.jpg');
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: 100% 100%;
}
.container {
  display: grid;
  grid-template-columns: 70% 20%;
  /* display: flex; */
  /* flex-direction: row; */
  /* background-color: 450000; */
  margin: 2px;
  width:100%;
}
.container div {
  /* background-color: black; */
  max-height: 550px;
  width: 95%;
  margin: 5px;
  padding: 1px;
  overflow: auto;
}

a:link {
  color: white;
  text-decoration: none;
}

/* visited link */
a:visited {
  color: white;
}

/* mouse over link */
a:hover {
  color: orange;
}

/* selected link */
a:active {
  color: green;
}
</style>

<body>
<!-- <body style="background-color:300000"> -->
<font face="Tahoma" color=#806565>
<center><h1>Picker</h1></center>

<h3>
<div align=right>
<a href="#" onclick="return openHelp()">Help</a>
</div>
</h3>
<hr style=height:5px;border-width:3px;border-color:black;background-color:#806565>

<font face="Tahoma" color=white>
<div class="container">
   <!--<div style=background-color:450000>-->
   <div>
      <center><h3>Enter Item</h3></center>
      <form action="/survey/pick/" onsubmit="return validate()" method="post">
         {% csrf_token %}
         {{ form.as_p }}
         <input type="submit" name="Pick" value="Submit"
            style="height:30px; width:125px; font-size:16">
      </form>
   </div>
   <div style=background-color:fff3f3>
   <font color=d0d0d0>
      <center><h3>Picker History</h3></center>
      {% if hist %}
         {% for h in hist %}
            {{ h.item }}
            <br>
         {% endfor %}
      {% else %}
          <p>No answers are available.</p>
      {% endif %}
   </div>
</div>
<script>
function openHelp() {
   let url_ = "{% url 'index' %}helppkr/"
   window.open(url_, "myWin", "width=300, height=325, left=700, top=270");
   return true;
}
function validate() {
   let elColl = document.forms[0].elements;
   let hit = false;
   for ( el of elColl ) {
      if ( el.id.substr(0, 10) == "id_website" && el.checked ) {
         hit = true;
         break;
      }
   }
   if ( !hit ) {
      let text = "Must choose at least one Website.";
      alert(text);
      return false;
   }

   return true;
}
</script>
</body>
</html>
